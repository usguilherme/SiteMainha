<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Online - Cássia Nunes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            height: auto !important;
            overflow-y: auto !important;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .agendar-container {
            width: 100%;
            max-width: 480px;
            padding: 30px;
        }
    </style>
</head>
<body>

    <div class="glass-panel agendar-container fade-in">
        <div style="text-align: center; margin-bottom: 25px;">
            <h2 class="text-gradient" style="font-family: var(--font-display); font-size: 24px; font-weight: 700;">Cássia Nunes</h2>
            <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Agende seu horário com facilidade</p>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label class="label-small">Seu Nome Completo</label>
                <input type="text" id="pub-nome" class="modern-input" placeholder="Ex: Maria Silva">
            </div>
            
            <div>
                <label class="label-small">Seu WhatsApp</label>
                <input type="text" id="pub-tel" class="modern-input" placeholder="(83) 99999-9999">
            </div>

            <div>
                <label class="label-small">Profissional Preferida</label>
                <select id="pub-profissional" class="modern-input">
                    <option value="">Qualquer profissional disponível</option>
                </select>
            </div>

            <div>
                <label class="label-small">Escolha o Serviço</label>
                <select id="pub-servico" class="modern-input">
                    <option value="">Carregando serviços...</option>
                </select>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div>
                    <label class="label-small">Data Desejada</label>
                    <input type="date" id="pub-data" class="modern-input">
                </div>
                <div>
                    <label class="label-small">Horário</label>
                    <input type="time" id="pub-hora" class="modern-input">
                </div>
            </div>

            <div id="pub-horarios-ocupados" style="display:none; font-size:12px; color:var(--text-muted); background:rgba(255,255,255,0.03); border-radius:8px; padding:10px 12px; line-height:1.6;"></div>
            <div id="pub-aviso-conflito" style="display:none; font-size:13px; color:#f87171; background:#f4717120; border:1px solid #f8717150; border-radius:8px; padding:10px 12px;">
                ⚠️ Esse horário já está ocupado. Escolha outro, por favor.
            </div>

            <button onclick="salvarAgendamentoPublico()" class="btn-glow" style="margin-top: 10px; width: 100%;">CONFIRMAR AGENDAMENTO</button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script>
        // Configuração real do Firebase CassiaNunesHair
        const firebaseConfig = {
            apiKey: "AIzaSyCpNsnwOVDLSZfXn-g6SE1V69BXHs8cYEc",
            authDomain: "mainhasite.firebaseapp.com",
            databaseURL: "https://mainhasite-default-rtdb.firebaseio.com",
            projectId: "mainhasite",
            storageBucket: "mainhasite.firebasestorage.app",
            messagingSenderId: "11190400668",
            appId: "1:11190400668:web:b59e8c134fbaee3e121f59"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // 1. Carrega os Serviços do Banco de Dados ordenados alfabeticamente
        db.ref('servicos').once('value').then(snap => {
            const servicosObj = snap.val() ? snap.val() : {};
            let servicos = Object.values(servicosObj);
            
            const sel = document.getElementById("pub-servico");
            if (servicos.length === 0) {
                sel.innerHTML = '<option value="">Nenhum serviço cadastrado</option>';
                return;
            }

            // Ordena os serviços por nome de A a Z
            servicos.sort((a, b) => a.nome.localeCompare(b.nome));

            sel.innerHTML = '<option value="">Selecione o serviço...</option>' + 
                servicos.map(s => `<option value="${s.nome}" data-preco="${s.preco}">${s.nome} - R$ ${parseFloat(s.preco).toFixed(2)}</option>`).join('');
        }).catch(err => {
            console.error("Erro ao carregar serviços:", err);
        });

        // 2. Carrega as Profissionais do Banco de Dados ordenadas alfabeticamente
        db.ref('profissionais').once('value').then(snap => {
            const profsObj = snap.val() ? snap.val() : {};
            let profissionais = Object.values(profsObj);

            const sel = document.getElementById("pub-profissional");
            
            // Ordena as profissionais por nome de A a Z
            profissionais.sort((a, b) => a.nome.localeCompare(b.nome));

            sel.innerHTML = '<option value="">Qualquer profissional disponível</option>' + 
                profissionais.map(p => `<option value="${p.id}" data-nome="${p.nome}">${p.nome}</option>`).join('');
        }).catch(err => {
            console.error("Erro ao carregar profissionais:", err);
        });

        // ===== HORÁRIOS OCUPADOS =====
        let horariosOcupadosCache = [];

        function chaveHora(hora) {
            return hora.replace(':', '-');
        }

        function carregarHorariosOcupados() {
            const data = document.getElementById("pub-data").value;
            const profId = document.getElementById("pub-profissional").value;
            const divAviso = document.getElementById("pub-horarios-ocupados");
            horariosOcupadosCache = [];

            if(!data) {
                divAviso.style.display = "none";
                return;
            }

            if(!profId) {
                divAviso.style.display = "block";
                divAviso.innerHTML = "ℹ️ Escolha uma profissional específica para vermos os horários já ocupados.";
                return;
            }

            db.ref(`disponibilidade/${data}/${profId}`).once('value').then(snap => {
                const ocupados = snap.val() ? Object.keys(snap.val()) : [];
                horariosOcupadosCache = ocupados.map(h => h.replace('-', ':'));

                if(horariosOcupadosCache.length === 0) {
                    divAviso.style.display = "block";
                    divAviso.innerHTML = "✅ Nenhum horário ocupado nesse dia com essa profissional ainda.";
                } else {
                    divAviso.style.display = "block";
                    divAviso.innerHTML = "🕐 Horários já ocupados nesse dia: <strong>" + horariosOcupadosCache.sort().join(", ") + "</strong>";
                }
                verificarConflitoHorario();
            }).catch(err => {
                console.error("Erro ao checar horários ocupados:", err);
                divAviso.style.display = "none";
            });
        }

        function verificarConflitoHorario() {
            const hora = document.getElementById("pub-hora").value;
            const avisoConflito = document.getElementById("pub-aviso-conflito");
            const temConflito = hora && horariosOcupadosCache.includes(hora);
            avisoConflito.style.display = temConflito ? "block" : "none";
            return temConflito;
        }

        document.getElementById("pub-data").addEventListener("change", carregarHorariosOcupados);
        document.getElementById("pub-profissional").addEventListener("change", carregarHorariosOcupados);
        document.getElementById("pub-hora").addEventListener("change", verificarConflitoHorario);
        // ===== FIM HORÁRIOS OCUPADOS =====

        // 3. Salva o Agendamento direto na Agenda do Salão
        function salvarAgendamentoPublico() {
            const nome = document.getElementById("pub-nome").value.trim();
            const tel = document.getElementById("pub-tel").value.trim();
            
            const servicoSelect = document.getElementById("pub-servico");
            const servicoNome = servicoSelect.value;
            const precoServico = parseFloat(servicoSelect.options[servicoSelect.selectedIndex]?.getAttribute('data-preco')) || 0;

            const profSelect = document.getElementById("pub-profissional");
            const profId = profSelect.value;
            const profNome = profSelect.options[profSelect.selectedIndex]?.getAttribute('data-nome') || "Geral";

            const data = document.getElementById("pub-data").value;
            const hora = document.getElementById("pub-hora").value;

            if(!nome || !tel || !servicoNome || !data || !hora) {
                alert("Por favor, preencha todos os campos obrigatórios!");
                return;
            }

            if(profId && verificarConflitoHorario()) {
                alert("⚠️ Esse horário já está ocupado com essa profissional. Por favor, escolha outro horário.");
                return;
            }

            const id = Date.now();
            const novoAtendimento = {
                id: id,
                data: data,
                hora: hora,
                timestamp: Date.now(),
                nomeCliente: nome,
                telefoneCliente: tel,
                profissionalId: profId || null,
                nomeProfissional: profNome,
                status: "Confirmado",
                servicos: [{ id: Date.now(), nome: servicoNome, preco: precoServico, tipo: 'servico' }],
                total: precoServico,
                pagamento: "Pendente",
                obs: "Agendado via Link Público"
            };

            db.ref(`atendimentos/${id}`).set(novoAtendimento)
                .then(() => {
                    if(profId) {
                        db.ref(`disponibilidade/${data}/${profId}/${chaveHora(hora)}`).set(true)
                            .catch(err => console.error("Erro ao registrar disponibilidade:", err));
                    }
                    alert("🎉 Agendamento realizado com sucesso! Aguardamos sua visita.");
                    location.reload();
                })
                .catch(err => {
                    alert("Erro ao realizar o agendamento. Tente novamente.");
                    console.error(err);
                });
        }
    </script>
</body>
</html>
