<div class="glass-panel form-inline">
    <input type="hidden" id="id-servico-edicao">
    <div class="mobile-stack" style="display:flex; gap:10px; width:100%;">
        <input type="text" id="serv-nome" placeholder="Nome do Serviço" class="modern-input" style="flex:2;">
        <input type="number" id="serv-preco" placeholder="Valor (R$)" class="modern-input" style="flex:1;">
    </div>
    
    <div class="action-buttons mt-10 mobile-stack">
        <button onclick="salvarServicoCad()" id="btn-salvar-servico" class="btn-primary full-width">Salvar</button>
        <button onclick="cancelarEdicaoServico()" id="btn-cancelar-servico" class="btn-danger full-width" style="display:none; margin-top:10px;">✕</button>
    </div>
</div>
<div id="lista-servicos-cad" class="grid-cards mt-15" style="margin-bottom: 80px;"></div>
<button onclick="abrirAba('financeiro')" class="btn-small mt-15 mobile-only" style="width:100%; opacity:0.7; margin-bottom: 30px;">Voltar ao Menu</button>
